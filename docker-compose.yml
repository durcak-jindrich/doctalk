services:
  db:
    image: paradedb/paradedb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctalk
      POSTGRES_PASSWORD: doctalk
      POSTGRES_DB: doctalk
    ports:
      - "5432:5432"
    volumes:
      - doctalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctalk -d doctalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema bootstrap. Deliberately runs on the database image, not the app
  # image: applying DDL needs psql and nothing else, so the database is ready
  # while the application image is still building. It also means no API keys
  # are handed to the migration step.
  migrate:
    image: paradedb/paradedb:latest-pg16
    environment:
      DATABASE_URL: postgresql://doctalk:doctalk@db:5432/doctalk
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["bash", "/migrations/apply.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://doctalk:doctalk@db:5432/doctalk
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  doctalk_pgdata:
