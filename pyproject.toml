[project]
name = "doctalk"
version = "0.1.0"
description = "Discuss your documents: grounded Q&A over 1-5 uploaded documents, with citations."
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "fastapi>=0.140.0",
    "langgraph>=1.2.9",
    "openai>=2.48.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live-LLM tests are opt-in: `uv run pytest` spends no OpenRouter quota,
# `uv run pytest -m live` runs them.
addopts = "-m 'not live'"
markers = [
    "live: hits a real LLM provider — costs quota, deselected by default",
]
