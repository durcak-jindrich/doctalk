name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.18"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # No OPENROUTER_API_KEY is set here on purpose: `uv run pytest` never
        # makes a live LLM call (addopts = -m 'not live' in pyproject.toml —
        # see docs/technical-decisions.md, "Testing & evaluation"), so CI
        # spends no OpenRouter quota on every push.
        run: uv run pytest

  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep (syntax + type check)
        # `az bicep build` catches syntax/type errors without needing Azure
        # credentials. A full `az deployment group validate` additionally
        # needs a resource group and real parameter values (secrets, tenant
        # ID) — that runs as part of the deploy workflow instead, not on
        # every PR.
        run: az bicep build --file infra/main.bicep
